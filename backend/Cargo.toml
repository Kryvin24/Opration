[package]
name = "dbx-teleport-sidecar"
version = "0.1.32"
edition = "2021"
description = "Native sidecar for the DBX Teleport plugin — drives tsh login and SSH terminal sessions."
license = "Apache-2.0"

[[bin]]
name = "dbx-teleport-sidecar"
path = "src/main.rs"

[dependencies]
dbx-plugin-sdk = { path = "vendor/dbx-plugin-sdk" }
serde_json = "1"
portable-pty = "0.8"

# `dbx-plugin package` injects `--config patch.crates-io.dbx-plugin-sdk.path=<its
# bundled sdk-root>` and builds with --locked. Mirroring that exact patch here
# keeps Cargo.lock already-satisfied so the locked build passes. Unused in the
# crate graph (our dep is the vendored path above) — machine-local dev setting.
[patch.crates-io]
dbx-plugin-sdk = { path = "C:/Users/zdiai/AppData/Local/npm-cache/_npx/f04b4ab906f25b7f/node_modules/@dbx-app/plugin-cli/sdk-root/plugins/sdk/rust/dbx-plugin-sdk" }

# panic=abort would stop the SDK from turning panics into errors; keep unwind.
[profile.release]
strip = true
lto = true
codegen-units = 1
